services:
  monitor:
    image: data-quality-pipeline-monitoring-agent:local
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    env_file: .env
    environment:
      DQ_DATA_DIR: /data
    volumes:
      - monitoring-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  monitoring-data:
