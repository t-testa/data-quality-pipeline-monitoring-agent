name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-toolchain.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/scan_secrets.py --history
      - run: pytest -q --cov=dqagent --cov-branch --cov-fail-under=80 --junitxml=artifacts/tests.xml
      - run: pip-audit -r requirements.lock --disable-pip --no-deps
      - run: pip-audit -r requirements-dev.lock --disable-pip --no-deps
      - run: pip-audit -r requirements-toolchain.lock --disable-pip --no-deps
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/tests.xml
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/container_env.py
      - run: docker compose up -d --build --wait
      - run: docker compose exec -T monitor python -m dqagent.cli demo all
      - run: python scripts/smoke_http.py
      - run: docker compose restart
      - run: docker compose up -d --wait
      - run: python scripts/smoke_http.py
      - run: mkdir -p artifacts && docker save data-quality-pipeline-monitoring-agent:local -o artifacts/image.tar
      - name: Scan image and reject fixable high or critical vulnerabilities
        run: >-
          docker run --rm -v "${{ github.workspace }}/artifacts:/scan"
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --input /scan/image.tar --scanners vuln --ignore-unfixed
          --severity HIGH,CRITICAL --exit-code 1 --format json --output /scan/image-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-audit
          path: artifacts/image-audit.json
      - if: always()
        run: docker compose down
